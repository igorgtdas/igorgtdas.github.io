<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="t d">
  <title id="t">PitStop Connect — conversation backend</title>
  <desc id="d">Channels (official WhatsApp Cloud API, WhatsApp QR sessions, Instagram and Messenger, webchat) reach a connector and the conversation API. Messages go through queues to a worker that routes to the AI agent first and to a human agent as fallback. Data is stored in PostgreSQL, Redis and S3.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#0f172a" stroke-opacity=".035"/></pattern>
    <style>
      text{font-family:Inter,'Segoe UI',system-ui,Arial,sans-serif;fill:#18181b}
      .t{font-size:13.5px;font-weight:600}
      .s{font-size:11px;fill:#71717a}
      .m{font-family:Consolas,'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;font-weight:600}
      .c{font-size:11px;fill:#3f3f46}
      .n{fill:#ffffff;stroke:#d4d4d8;stroke-width:1.2}
      .k{fill:#f4f4f5;stroke:#d4d4d8}
      .hi{fill:#eff6ff;stroke:#2563eb;stroke-width:1.3}
      .ln{stroke:#a1a1aa;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <rect width="880" height="420" rx="14" fill="#ffffff"/>
  <rect width="880" height="420" rx="14" fill="url(#g)"/>

  <text class="m" x="20" y="30" style="fill:#d97706">CHANNELS</text>
  <rect class="hi" x="20" y="42" width="170" height="50" rx="10"/>
  <text class="t" x="105" y="64" text-anchor="middle">WhatsApp official</text>
  <text class="s" x="105" y="80" text-anchor="middle">Meta Cloud API · templates</text>
  <rect class="hi" x="20" y="112" width="170" height="50" rx="10"/>
  <text class="t" x="105" y="134" text-anchor="middle">WhatsApp QR code</text>
  <text class="s" x="105" y="150" text-anchor="middle">persistent sessions</text>
  <rect class="n" x="20" y="182" width="170" height="50" rx="10"/>
  <text class="t" x="105" y="204" text-anchor="middle">Instagram · Messenger</text>
  <text class="s" x="105" y="220" text-anchor="middle">Meta messaging</text>
  <rect class="n" x="20" y="252" width="170" height="50" rx="10"/>
  <text class="t" x="105" y="274" text-anchor="middle">Webchat</text>
  <text class="s" x="105" y="290" text-anchor="middle">site widget</text>

  <!-- Connector -->
  <rect class="n" x="230" y="122" width="130" height="130" rx="12"/>
  <text class="t" x="295" y="160" text-anchor="middle">Connector</text>
  <text class="s" x="295" y="180" text-anchor="middle">channel gateway</text>
  <text class="s" x="295" y="196" text-anchor="middle">session leases</text>
  <text class="s" x="295" y="212" text-anchor="middle">inbound buffer</text>

  <path class="ln" d="M190 137H228" marker-end="url(#a)"/>
  <path class="ln" d="M190 207H228" marker-end="url(#a)"/>
  <path class="ln" d="M190 277H210V237H228" marker-end="url(#a)"/>
  <path d="M190 67H475V120" stroke="#2563eb" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#ac)"/>
  <text class="s" x="330" y="60" text-anchor="middle" style="fill:#2563eb">signed webhooks</text>

  <!-- API -->
  <rect class="hi" x="400" y="122" width="150" height="130" rx="12"/>
  <text class="t" x="475" y="160" text-anchor="middle">Conversation API</text>
  <text class="s" x="475" y="180" text-anchor="middle">NestJS · REST</text>
  <text class="s" x="475" y="196" text-anchor="middle">JWT · RBAC · tenants</text>
  <text class="s" x="475" y="212" text-anchor="middle">realtime (SSE)</text>
  <path class="ln" d="M360 187H398" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Filas -->
  <rect x="590" y="112" width="130" height="150" rx="12" fill="#fafafa" stroke="#d4d4d8"/>
  <text class="m" x="605" y="134" style="fill:#d97706">QUEUES</text>
  <rect class="k" x="604" y="144" width="102" height="24" rx="6"/><text class="c" x="655" y="160" text-anchor="middle">inbound</text>
  <rect class="k" x="604" y="174" width="102" height="24" rx="6"/><text class="c" x="655" y="190" text-anchor="middle">delivery</text>
  <rect class="k" x="604" y="204" width="102" height="24" rx="6"/><text class="c" x="655" y="220" text-anchor="middle">campaigns</text>
  <rect class="k" x="604" y="234" width="102" height="20" rx="6" style="stroke:#d97706;stroke-opacity:.6"/><text class="c" x="655" y="248" text-anchor="middle" style="font-size:10px">dead-letter</text>
  <path class="ln" d="M550 187H588" marker-end="url(#a)"/>

  <rect class="n" x="760" y="147" width="100" height="80" rx="12"/>
  <text class="t" x="810" y="183" text-anchor="middle">Worker</text>
  <text class="s" x="810" y="200" text-anchor="middle">routing · retries</text>
  <path class="ln" d="M720 187H758" marker-end="url(#a)"/>

  <!-- Roteamento -->
  <rect class="hi" x="760" y="262" width="100" height="50" rx="10"/>
  <text class="t" x="810" y="284" text-anchor="middle">AI agent</text>
  <text class="s" x="810" y="300" text-anchor="middle">first response</text>
  <rect class="n" x="760" y="352" width="100" height="50" rx="10"/>
  <text class="t" x="810" y="374" text-anchor="middle">Human</text>
  <text class="s" x="810" y="390" text-anchor="middle">least-load queue</text>
  <path d="M810 227V260" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ac)"/>
  <path d="M810 312V350" stroke="#d97706" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ao)"/>
  <text class="s" x="800" y="336" text-anchor="end" style="fill:#d97706">fallback · SLA</text>

  <!-- Dados -->
  <path class="ln" d="M475 252V300" stroke-dasharray="4 4"/>
  <path class="ln" d="M330 300H690" stroke-dasharray="4 4"/>
  <path class="ln" d="M330 300V318M475 300V318M620 300V318" stroke-dasharray="4 4"/>
  <rect class="n" x="270" y="320" width="120" height="50" rx="10"/>
  <text class="t" x="330" y="342" text-anchor="middle">PostgreSQL</text>
  <text class="s" x="330" y="358" text-anchor="middle">Prisma ORM</text>
  <rect class="n" x="415" y="320" width="120" height="50" rx="10"/>
  <text class="t" x="475" y="342" text-anchor="middle">Redis</text>
  <text class="s" x="475" y="358" text-anchor="middle">queues · locks · pub/sub</text>
  <rect class="n" x="560" y="320" width="120" height="50" rx="10"/>
  <text class="t" x="620" y="342" text-anchor="middle">S3</text>
  <text class="s" x="620" y="358" text-anchor="middle">media · signed URLs</text>

  <text class="s" x="20" y="400">Backend view · front-end omitted</text>
</svg>
