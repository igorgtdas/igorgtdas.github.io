<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-labelledby="t d">
  <title id="t">PitStop Notify — scheduled messaging pipeline</title>
  <desc id="d">A scheduler triggers daily pipelines that collect weather, service orders and vehicle mileage, compose a message from templates, add a short LLM insight and send it on WhatsApp with retries, logging every dispatch and alerting an admin on failure.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6b7d"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
    <style>
      text{font-family:'Segoe UI',system-ui,Arial,sans-serif;fill:#e7edf4}
      .t{font-size:13.5px;font-weight:600}
      .s{font-size:11px;fill:#8d9aab}
      .m{font-family:Consolas,'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;font-weight:600}
      .n{fill:#121921;stroke:#2e3d4e;stroke-width:1.2}
      .hi{fill:#0f2a33;stroke:#22d3ee;stroke-width:1.3}
      .ln{stroke:#5b6b7d;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <rect width="880" height="360" rx="14" fill="#0b1016"/>
  <rect width="880" height="360" rx="14" fill="url(#g)"/>

  <text class="m" x="150" y="22" style="fill:#fb923c">DATA SOURCES</text>
  <rect class="n" x="150" y="30" width="118" height="44" rx="9"/>
  <text class="t" x="209" y="50" text-anchor="middle">Weather</text>
  <text class="s" x="209" y="65" text-anchor="middle">forecast API</text>
  <rect class="n" x="280" y="30" width="118" height="44" rx="9"/>
  <text class="t" x="339" y="50" text-anchor="middle">Service orders</text>
  <text class="s" x="339" y="65" text-anchor="middle">workshop DB</text>
  <rect class="n" x="410" y="30" width="118" height="44" rx="9"/>
  <text class="t" x="469" y="50" text-anchor="middle">Vehicle km</text>
  <text class="s" x="469" y="65" text-anchor="middle">history · avg/month</text>

  <path class="ln" d="M209 74L240 138" marker-end="url(#a)"/>
  <path class="ln" d="M339 74L270 138" marker-end="url(#a)"/>
  <path class="ln" d="M469 74L300 140" marker-end="url(#a)"/>

  <!-- Pipeline -->
  <rect class="n" x="20" y="140" width="130" height="72" rx="11"/>
  <text class="t" x="85" y="166" text-anchor="middle">Scheduler</text>
  <text class="s" x="85" y="183" text-anchor="middle">Airflow DAGs</text>
  <text class="s" x="85" y="199" text-anchor="middle">05:30 · 12:00 · 19:00</text>

  <rect class="hi" x="190" y="140" width="130" height="72" rx="11"/>
  <text class="t" x="255" y="170" text-anchor="middle">Collect</text>
  <text class="s" x="255" y="188" text-anchor="middle">per customer</text>

  <rect class="hi" x="360" y="140" width="130" height="72" rx="11"/>
  <text class="t" x="425" y="166" text-anchor="middle">Project</text>
  <text class="s" x="425" y="183" text-anchor="middle">next oil · tires</text>
  <text class="s" x="425" y="199" text-anchor="middle">service due date</text>

  <rect class="hi" x="530" y="140" width="130" height="72" rx="11"/>
  <text class="t" x="595" y="166" text-anchor="middle">Compose</text>
  <text class="s" x="595" y="183" text-anchor="middle">templates</text>
  <text class="s" x="595" y="199" text-anchor="middle">+ LLM insight</text>

  <rect class="hi" x="700" y="140" width="160" height="72" rx="11"/>
  <text class="t" x="780" y="166" text-anchor="middle">Send</text>
  <text class="s" x="780" y="183" text-anchor="middle">WhatsApp gateway</text>
  <text class="s" x="780" y="199" text-anchor="middle">retry · backoff · anti-spam</text>

  <path d="M150 176H188" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#ac)"/>
  <path d="M320 176H358" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#ac)"/>
  <path d="M490 176H528" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#ac)"/>
  <path d="M660 176H698" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#ac)"/>

  <!-- LLM -->
  <rect class="n" x="530" y="40" width="130" height="50" rx="9"/>
  <text class="t" x="595" y="62" text-anchor="middle">LLM</text>
  <text class="s" x="595" y="78" text-anchor="middle">primary + fallback</text>
  <path class="ln" d="M595 90V138" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Saídas -->
  <rect class="n" x="530" y="262" width="150" height="56" rx="10"/>
  <text class="t" x="605" y="286" text-anchor="middle">Dispatch log</text>
  <text class="s" x="605" y="302" text-anchor="middle">Postgres · audit</text>
  <rect class="n" x="710" y="262" width="150" height="56" rx="10"/>
  <text class="t" x="785" y="286" text-anchor="middle">Admin alert</text>
  <text class="s" x="785" y="302" text-anchor="middle">on failed send</text>
  <path class="ln" d="M750 212V240H605V260" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <path d="M800 212V260" stroke="#fb923c" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ao)"/>

  <text class="s" x="20" y="340">Simplified pipeline · one run per scheduled report</text>
</svg>
