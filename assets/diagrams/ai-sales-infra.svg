<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" role="img" aria-labelledby="t d">
  <title id="t">PitStop AI Sales — AWS infrastructure</title>
  <desc id="d">Messaging gateway calls a public load balancer, which forwards to a Fargate container in private subnets. The container uses Redis and Postgres with pgvector, reads secrets, writes logs and reaches the LLM API through a NAT gateway. Terraform provisions it; GitHub Actions builds images to ECR.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#0f172a" stroke-opacity=".035"/></pattern>
    <style>
      text{font-family:Inter,'Segoe UI',system-ui,Arial,sans-serif;fill:#18181b}
      .t{font-size:13.5px;font-weight:600}
      .s{font-size:11px;fill:#71717a}
      .m{font-family:Consolas,'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;font-weight:600}
      .n{fill:#ffffff;stroke:#d4d4d8;stroke-width:1.2}
      .hi{fill:#eff6ff;stroke:#2563eb;stroke-width:1.3}
      .ln{stroke:#a1a1aa;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <rect width="880" height="490" rx="14" fill="#ffffff"/>
  <rect width="880" height="490" rx="14" fill="url(#g)"/>

  <!-- Fora da AWS -->
  <rect class="n" x="20" y="222" width="110" height="56" rx="10"/>
  <text class="t" x="75" y="246" text-anchor="middle">Customer</text>
  <text class="s" x="75" y="263" text-anchor="middle">WhatsApp</text>

  <rect class="n" x="150" y="222" width="120" height="56" rx="10"/>
  <text class="t" x="210" y="246" text-anchor="middle">Messaging</text>
  <text class="s" x="210" y="263" text-anchor="middle">gateway · webhook</text>

  <rect class="n" x="150" y="40" width="120" height="50" rx="10"/>
  <text class="t" x="210" y="62" text-anchor="middle">LLM API</text>
  <text class="s" x="210" y="78" text-anchor="middle">outbound only</text>

  <path class="ln" d="M130 250H148" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- AWS -->
  <rect x="296" y="20" width="564" height="384" rx="14" fill="none" stroke="#d97706" stroke-opacity=".55" stroke-dasharray="6 5"/>
  <text class="m" x="312" y="40" style="fill:#d97706">AWS · PROVISIONED WITH TERRAFORM</text>

  <rect x="320" y="50" width="320" height="336" rx="12" fill="#fafafa" stroke="#d4d4d8"/>
  <text class="m" x="606" y="68" text-anchor="end" style="fill:#71717a">VPC</text>

  <rect x="336" y="76" width="288" height="76" rx="10" fill="none" stroke="#d4d4d8" stroke-dasharray="3 4"/>
  <text class="m" x="346" y="92" style="fill:#a1a1aa">PUBLIC SUBNET</text>
  <rect class="hi" x="352" y="98" width="120" height="46" rx="9"/>
  <text class="t" x="412" y="118" text-anchor="middle">Load balancer</text>
  <text class="s" x="412" y="134" text-anchor="middle">ALB</text>
  <rect class="n" x="496" y="98" width="112" height="46" rx="9"/>
  <text class="t" x="552" y="118" text-anchor="middle">NAT gateway</text>
  <text class="s" x="552" y="134" text-anchor="middle">egress</text>

  <rect x="336" y="168" width="288" height="204" rx="10" fill="none" stroke="#d4d4d8" stroke-dasharray="3 4"/>
  <text class="m" x="346" y="186" style="fill:#a1a1aa">PRIVATE SUBNETS</text>
  <rect class="hi" x="352" y="196" width="256" height="62" rx="10"/>
  <text class="t" x="480" y="221" text-anchor="middle">ECS Fargate</text>
  <text class="s" x="480" y="239" text-anchor="middle">FastAPI agent container · no public IP</text>

  <rect class="n" x="352" y="290" width="120" height="62" rx="10"/>
  <text class="t" x="412" y="316" text-anchor="middle">ElastiCache</text>
  <text class="s" x="412" y="333" text-anchor="middle">Redis</text>
  <rect class="n" x="488" y="290" width="120" height="62" rx="10"/>
  <text class="t" x="548" y="316" text-anchor="middle">RDS Postgres</text>
  <text class="s" x="548" y="333" text-anchor="middle">+ pgvector</text>

  <!-- Fluxo -->
  <path d="M270 250H306V121H350" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#ac)"/>
  <path d="M412 144V194" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ac)"/>
  <path class="ln" d="M412 258V288" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="ln" d="M548 258V288" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="ln" d="M552 196V146" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <path class="ln" d="M552 98V64H270" stroke-dasharray="4 4" marker-end="url(#a)"/>

  <!-- Serviços gerenciados -->
  <rect class="n" x="664" y="66" width="180" height="50" rx="10"/>
  <text class="t" x="754" y="88" text-anchor="middle">SSM · Secrets Manager</text>
  <text class="s" x="754" y="104" text-anchor="middle">secrets out of the code</text>
  <rect class="n" x="664" y="130" width="180" height="50" rx="10"/>
  <text class="t" x="754" y="152" text-anchor="middle">CloudWatch</text>
  <text class="s" x="754" y="168" text-anchor="middle">logs · retention policy</text>
  <rect class="n" x="664" y="194" width="180" height="50" rx="10"/>
  <text class="t" x="754" y="216" text-anchor="middle">Scheduled scaling</text>
  <text class="s" x="754" y="232" text-anchor="middle">dev off after hours</text>
  <rect class="n" x="664" y="258" width="180" height="50" rx="10"/>
  <text class="t" x="754" y="280" text-anchor="middle">IAM roles</text>
  <text class="s" x="754" y="296" text-anchor="middle">least privilege</text>
  <rect class="n" x="664" y="322" width="180" height="50" rx="10"/>
  <text class="t" x="754" y="344" text-anchor="middle">ECR</text>
  <text class="s" x="754" y="360" text-anchor="middle">immutable image tags</text>

  <path class="ln" d="M608 227H650" stroke-dasharray="4 4"/>
  <path class="ln" d="M650 91V347" stroke-dasharray="4 4"/>
  <path class="ln" d="M650 91H662M650 155H662M650 219H662M650 283H662M650 347H662" />

  <!-- Fora: CI/CD + IaC -->
  <rect class="n" x="340" y="424" width="210" height="50" rx="10"/>
  <text class="t" x="445" y="446" text-anchor="middle">Terraform</text>
  <text class="s" x="445" y="462" text-anchor="middle">remote state · dev / prod split</text>
  <path class="ln" d="M445 424V406" marker-end="url(#a)"/>

  <rect class="n" x="664" y="424" width="180" height="50" rx="10"/>
  <text class="t" x="754" y="446" text-anchor="middle">GitHub Actions</text>
  <text class="s" x="754" y="462" text-anchor="middle">build → push → deploy</text>
  <path class="ln" d="M754 424V374" marker-end="url(#a)"/>
</svg>
